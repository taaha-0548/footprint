[project]
name = "fps"
version = "0.1.0"
description = "Footprint Prediction Study, Part 1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas",
  "pyarrow",
  "huggingface_hub",
  "requests",
  "rank-bm25",
  "networkx",
  "numpy",
  "scikit-learn",
  "pyyaml",
  "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
